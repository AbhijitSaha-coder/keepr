services:
  # Backend API & Background Workers
  - type: web
    name: keepr-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: keepr-postgres
          property: connectionString
      - key: REDIS_URL
        value: redis://127.0.0.1:6379
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: uploads
      - key: EMAIL_PROVIDER
        value: mock
      - key: CORS_ORIGIN
        value: "*"
      - key: APP_URL
        value: "http://localhost:5173"

  # Frontend Web Application (React SPA)
  - type: web
    name: keepr-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://keepr-backend-z3xx.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database (Free Tier)
  - name: keepr-postgres
    plan: free
    region: oregon
    databaseName: keepr
    user: keepr_user
