services:
  # Backend API & Background Workers
  - type: web
    name: keepr-backend
    runtime: node
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma db push && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: keepr-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: keepr-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: STORAGE_SIGNING_SECRET
        generateValue: true
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_LOCAL_ROOT
        value: uploads
      - key: EMAIL_PROVIDER
        value: mock
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false

  # Redis Cache & BullMQ Queue
  - type: redis
    name: keepr-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # Managed PostgreSQL Database
  - name: keepr-postgres
    plan: starter
    region: oregon
    databaseName: keepr
    user: keepr_user
