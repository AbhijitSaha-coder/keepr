name: Keepr CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build All Modules
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: keepr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Sync Prisma Schema & Seed Test DB
        run: |
          cd backend
          npx prisma generate
          npx prisma db push
          npm run prisma:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keepr_test?schema=public

      - name: Run Backend Unit, Integration & Security Tests
        run: cd backend && npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/keepr_test?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: keepr_ci_test_jwt_secret_key_minimum_32_characters!
          STORAGE_SIGNING_SECRET: keepr_ci_test_storage_signing_key_32_chars!

      - name: Run Frontend Component Tests
        run: cd frontend && npm test

      - name: Build Backend (TypeScript)
        run: cd backend && npm run build

      - name: Build Frontend (Vite & Tailwind)
        run: cd frontend && npm run build
